<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8ecd2">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{ --bg:#0b0e2a; --line:rgba(90,200,255,.10); --cyan:#5fd8ff; --ink:#bfe9ff; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
  body{
    font-family:'Pretendard',system-ui,sans-serif;color:var(--ink);font-weight:700;
    background:#05070f;
    margin:0;display:flex;align-items:center;justify-content:center;
    user-select:none;touch-action:none;
  }
  /* 게임은 세로형 프레임 안에서 동작. 폰=꽉참, 넓은창=중앙 고정 */
  #app{
    position:relative;display:flex;flex-direction:column;
    width:100%;height:100%;max-width:min(100vw,calc(100dvh*0.62));
    height:100dvh;overflow:hidden;
    background:
      repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 44px),
      repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 44px),
      radial-gradient(120% 80% at 50% 0%,#141a45 0%,var(--bg) 70%);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    box-shadow:0 0 60px rgba(95,216,255,.18);
  }
  @supports not (height:100dvh){ #app{height:100vh} }
  .glow{text-shadow:0 0 6px currentColor,0 0 16px currentColor}

  header{flex:none;padding:6px 12px 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hl{font-size:17px;line-height:1.35;color:#7fd4ff;text-shadow:0 0 8px rgba(95,216,255,.75)}
  #goalBar{flex:none;padding:2px 14px 6px;display:flex;align-items:center;gap:10px}
  #goalBar .glabel{font-size:13px;color:#9fe3ff;white-space:nowrap;text-shadow:0 0 6px rgba(95,216,255,.6)}
  #goalBar .gtrack{flex:1;height:16px;border:2px solid #ff8fdc;border-radius:999px;overflow:hidden;
    box-shadow:0 0 10px rgba(255,143,220,.5),inset 0 0 8px rgba(255,143,220,.22);background:rgba(255,143,220,.06)}
  #goalBar .gtrack i{display:block;height:100%;border-radius:999px;
    background:linear-gradient(90deg,#ffcf6b,#ff9a5c);box-shadow:0 0 10px #ffb15c;transition:width .3s}
  #goalBar .gcombo{font-size:13px;color:#ff9fd6;white-space:nowrap;text-shadow:0 0 6px rgba(255,143,220,.6)}
  .hl b{color:#fff;text-shadow:0 0 10px #5fd8ff,0 0 22px #5fd8ff}
  .hl.pink{color:#ff8fdc;text-shadow:0 0 8px rgba(255,143,220,.8)}
  .hl.pink b{color:#fff;text-shadow:0 0 10px #ff8fdc,0 0 22px #ff8fdc}
  .right{text-align:right}
  .np{background:transparent;border:2px solid #c77bff;border-radius:999px;
    padding:7px 15px;font-family:'Pretendard',sans-serif;font-weight:700;font-size:15px;color:#f0d8ff;
    box-shadow:0 0 10px rgba(199,123,255,.7),inset 0 0 10px rgba(199,123,255,.35);
    text-shadow:0 0 8px #c77bff;margin-bottom:6px}
  .np:active{transform:translateY(2px)}
  .bar{width:130px;height:20px;border:2px solid #ff8fdc;border-radius:999px;margin-top:5px;
    box-shadow:0 0 10px rgba(255,143,220,.6),inset 0 0 8px rgba(255,143,220,.25);overflow:hidden}
  .bar i{display:block;height:100%;width:20%;border-radius:999px;
    background:linear-gradient(90deg,#ffcf6b,#ff9a5c);box-shadow:0 0 12px #ffb15c;transition:width .25s}

  #targetBar{flex:none;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    padding:2px 10px 6px;min-height:0}
  #targetBar .tchip{border:1.6px solid var(--cyan);border-radius:999px;
    padding:4px 12px;font-size:14px;color:#dff4ff;text-shadow:0 0 6px var(--cyan);
    box-shadow:0 0 8px rgba(95,216,255,.35);white-space:nowrap;transition:.25s}
  #targetBar .tchip.done{border-color:#7cffb2;color:#eafff3;text-shadow:0 0 8px #7cffb2;
    box-shadow:0 0 12px rgba(124,255,178,.5);background:rgba(124,255,178,.12)}
  #stage{flex:1;min-height:0;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  #itemBar{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:2}
  #trayBtn{position:absolute;left:76px;bottom:12px;z-index:3;width:46px;height:46px;padding:0;
    border-radius:50%;font-size:19px}
  #tray{position:absolute;left:76px;bottom:64px;display:flex;flex-direction:column;gap:8px;z-index:2;
    opacity:0;pointer-events:none;transform:translateY(8px);transition:.18s}
  #tray.open{opacity:1;pointer-events:auto;transform:translateY(0)}
  .fab{background:transparent;border:2px solid var(--cyan);
    border-radius:999px;color:#eaf9ff;font-family:'Pretendard',sans-serif;font-weight:700;
    box-shadow:0 0 12px rgba(95,216,255,.65),inset 0 0 12px rgba(95,216,255,.25);
    text-shadow:0 0 8px var(--cyan);display:flex;align-items:center;justify-content:center;gap:5px;
    padding:9px 14px;font-size:15px;white-space:nowrap}
  .fab:active{transform:translateY(2px)}
  .fab[disabled]{opacity:.35;box-shadow:none}
  .fab.active{border-color:#ffe08c;color:#fff8e0;text-shadow:0 0 10px #ffe08c;
    box-shadow:0 0 18px rgba(255,224,140,.85),inset 0 0 14px rgba(255,224,140,.3);
    animation:itempulse 1s ease-in-out infinite}
  @keyframes itempulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  .veil{position:absolute;inset:0;display:none;place-items:center;
    background:rgba(6,9,30,.78);backdrop-filter:blur(3px);z-index:5}
  .veil.on{display:grid}
  .card{background:rgba(12,17,48,.92);border:2px solid var(--cyan);border-radius:24px;
    padding:24px 26px;text-align:center;max-width:84%;
    box-shadow:0 0 24px rgba(95,216,255,.55),inset 0 0 26px rgba(95,216,255,.14)}
  .card h2{margin:0 0 8px;font-size:27px;color:#fff;text-shadow:0 0 12px #5fd8ff,0 0 26px #5fd8ff}
  .card p{margin:5px 0;font-size:15px;color:#a9d8f5;line-height:1.55}
  .card p b{color:#fff;text-shadow:0 0 10px #5fd8ff}
  .btn{margin-top:16px;background:transparent;border:2px solid #7cffb2;border-radius:999px;
    padding:12px 30px;font-family:'Pretendard',sans-serif;font-weight:800;font-size:19px;color:#eafff3;
    text-shadow:0 0 10px #7cffb2;box-shadow:0 0 16px rgba(124,255,178,.6),inset 0 0 14px rgba(124,255,178,.25)}
  .btn:active{transform:translateY(3px)}
  .chip{display:inline-block;border:1.5px solid #ff8fdc;border-radius:999px;padding:4px 12px;margin:3px;
    font-size:14px;color:#ffd9f2;text-shadow:0 0 8px #ff8fdc;box-shadow:0 0 10px rgba(255,143,220,.35)}
</style>
</head>
<body>


<div id="app">
<header>
  <div style="display:flex;align-items:center;gap:6px">
    <button class="np" id="btnMenu" style="padding:7px 12px">❚❚</button>
    <button class="np" id="btnMute" style="padding:7px 12px">🔊</button>
    <button class="np" id="btnShop" style="padding:7px 12px">🛒</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px;font-size:13px">
    <span class="hl" style="font-size:13px">S<b id="uiStage">1</b></span>
    <span class="hl" style="font-size:13px">🏆<b id="uiScore">0</b></span>
    <span class="hl" style="font-size:13px">💰<b id="uiCoins">0</b></span>
  </div>
</header>
<div id="goalBar">
  <span class="glabel" id="uiGoal">과일</span>
  <div class="gtrack"><i id="comboBar" style="width:0%"></i></div>
  <span class="gcombo">x<b id="uiCombo">1</b></span>
</div>
<div id="targetBar"></div>

<div id="stage">
  <canvas id="cv"></canvas>
  <div id="itemBar">
    <button class="fab" id="btnHint">💡 <b id="uiHint">3</b></button>
    <button class="fab" id="btnSwap">🔄 <b id="uiSwap">3</b></button>
  </div>
  <button class="fab" id="trayBtn">✨</button>
  <div id="tray">
    <button class="fab" id="btnBomb">💣 <b id="uiBomb">2</b></button>
    <button class="fab" id="btnRainbow">🌈 <b id="uiRainbow">2</b></button>
  </div>
  <div class="veil" id="veil"><div class="card" id="card"></div></div>
</div>
</div>

<script>
/* ══════════════════════════════════════════
   낱글자 팡팡! — 한글 단어 버블슈터
   ══════════════════════════════════════════ */

/* ---------- 사전 ---------- */
const DICT_BY_CAT = {
  '과일': ['사과','포도','딸기','수박','참외','자두','바나나','오렌지','레몬','복숭아','체리','망고','멜론','키위','앵두','살구','자몽','석류','토마토','대추','모과','매실','앵도','귤','감','배','밤','파인애플','블루베리','무화과','한라봉','청포도','머루','다래'],
  '동물': ['사자','호랑이','코끼리','토끼','다람쥐','거북이','고양이','강아지','원숭이','기린','하마','얼룩말','여우','늑대','사슴','너구리','개구리','병아리','오리','돼지','판다','펭귄','악어','고래','두더지','고슴도치','치타','표범','물개','바다표범','부엉이','까치','참새','비둘기','다람쥐','수달','청설모','두루미'],
  '먹거리': ['김밥','라면','김치','만두','피자','치킨','우유','국수','초밥','카레','계란','감자','고구마','두부','도넛','사탕','과자','주스','떡볶이','케이크','빙수','호빵','비빔밥','불고기','갈비','냉면','짜장면','짬뽕','순대','어묵','호떡','붕어빵','식혜','미역국','된장국','유부초밥','주먹밥'],
  '탈것': ['자동차','기차','비행기','자전거','버스','택시','트럭','로켓','소방차','구급차','경찰차','지하철','헬기','요트','유모차','오토바이','포클레인','트랙터','케이블카','잠수함','여객선','우주선','열기구','썰매','기관차','전동차','화물차'],
  '자연': ['나무','바다','하늘','구름','바람','무지개','태양','호수','파도','번개','안개','이슬','모래','폭포','언덕','계곡','노을','새벽','폭우','서리','우박','고드름','들판','절벽','동굴','갯벌','습지','오아시스','메아리','아지랑이','물결','파도','샛별']
};
const BONUS_WORDS = ['사과나무','바나나우유','포도나무','감나무','밤나무','대추나무','솔방울','도토리','다람쥐집','고양이집','비빔국수','볶음밥','김치찌개','된장찌개','고구마빵','바나나맛','딸기우유','초코우유','자동차길','소방관차'];
const GENERIC_WORDS = [
  '감기','안녕','사람','친구','생일','가족','학교','교실','책상','의자','창문','거울',
  '지갑','열쇠','우산','신발','양말','모자','장갑','안경','시계','달력','편지','소포',
  '병원','약국','은행','경찰','소방','공원','풍선','비누','수건','칫솔','치약','침대',
  '이불','베개','냄비','접시','컵','그릇','전화','사진','영화','음악','노래','그림',
  '가위','풀','공책','연필','지우개','필통','우유','물감','악기','피아노','바이올린',
  '축구','야구','농구','수영','달리기','줄넘기','자전거','인사','약속','선물','파티',
  '여행','바닷가','산책','휴식','청소','빨래','설거지','요리','식사','아침','점심',
  '저녁','오늘','내일','어제','아빠','엄마','언니','오빠','동생','할머니','할아버지',
  '이모','삼촌','선생님','의사','간호사','경찰관','소방관','요리사','화가','가수',
  '배우','기자','농부','어부','목수','우체부'
,
  '색깔','빨강','노랑','파랑','초록','보라','하양','검정','분홍','하늘','무늬','줄무늬',
  '봄','여름','가을','겨울','계절','날씨','맑음','흐림','기온','온도',
  '머리','얼굴','눈썹','입술','손가락','발가락','어깨','무릎','허리','손톱',
  '숫자','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열',
  '월요일','화요일','수요일','목요일','금요일','토요일','일요일','주말','평일',
  '아침밥','점심밥','저녁밥','간식','후식','반찬','국물','양념',
  '교과서','수학','국어','영어','과학','미술','음악시간','체육','급식',
  '놀이터','그네','미끄럼틀','시소','정글짐','모래놀이',
  '기쁨','슬픔','화남','놀람','무서움','즐거움','행복','걱정',
  '마을','도시','시골','골목','다리','계단','엘리베이터','문','창','지붕',
  '봉투','상자','바구니','자루','보따리','가방','배낭',
  '동화책','만화책','일기장','수첩','도장','스티커',
  '눈사람','썰매타기','물놀이','불꽃놀이','캠핑','소풍','운동회',
  '거북선','한복','태극기','한글날','설날','추석','생일파티','졸업식','입학식'
];
const CATS = Object.keys(DICT_BY_CAT);
const DICT = new Map();
for (const c of CATS) for (const w of DICT_BY_CAT[c]) if (w.length>=2) DICT.set(w,c);
for (const w of BONUS_WORDS) DICT.set(w,'보너스');
for (const w of GENERIC_WORDS) if (w.length>=2 && !DICT.has(w)) DICT.set(w,'생활');
const MAXW = 5;

/* ---------- 찰흙 색 ---------- */
const PALETTE = [
  ['#7cffb2','#3fe08b'],
  ['#ff8fdc','#ff5cc0'],
  ['#6fd6ff','#38b8f0'],
  ['#ffd86f','#f2b93c'],
  ['#ff9a5c','#f0762e'],
  ['#c08cff','#9a5cff'],
  ['#5cffe1','#25dcc0'],
  ['#ff7a7a','#f04d4d']
];
let COLORMAP={};
function colorOf(ch){
  if(COLORMAP[ch])return COLORMAP[ch];
  let h=0; for(let i=0;i<ch.length;i++) h=(h*31+ch.charCodeAt(i))>>>0;
  return PALETTE[h%PALETTE.length];
}
function mapColors(pool){
  COLORMAP={};
  shuffle(pool).forEach((s,i)=>{COLORMAP[s]=PALETTE[i%PALETTE.length];});
}

/* ---------- 캔버스 ---------- */
const cv=document.getElementById('cv'); let ctx=cv.getContext('2d');
let W=0,H=0,R=0,ROWH=0,DPR=1;
const COLS=7;
let BX=0,BY=0,BW=0,BH=0;      // 보드 안쪽 영역
const FRAME=9;

function resize(){
  const box=document.getElementById('stage').getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2.5);
  W=Math.max(1,box.width); H=Math.max(1,box.height);
  cv.width=W*DPR; cv.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const pad=10;
  BX=pad+FRAME; BW=W-(pad+FRAME)*2;
  R=BW/(COLS*2);
  // 버블 최대 지름 상한(태블릿/데스크톱에서 과대 방지): 화면 높이 기준
  const Rmax=Math.min(H*0.052, 46);
  if(R>Rmax){ R=Rmax; BW=R*COLS*2; BX=(W-BW)/2; }
  ROWH=R*1.72;
  BY=6+FRAME;
  // ── 시안 실측 비율(IMG_0430) ──
  // 보드 하단 = 화면 88%, 발사버블 중심 = 화면 69%, 대포 하단 = 화면 86%
  G.shooterY=H*0.69;                          // 발사버블 중심 (화면 69%)
  // 발사버블 중심이 보드 하단 선에 딱 걸치게
  BH=G.shooterY-BY;
  // maxRows: 보드 높이에 맞게
  G.maxRows=Math.max(6,Math.floor((BH-R*2)/ROWH)+1);
  BOARDLAYER=null; SPR.clear(); G.trajA=null;
}
let _rz;
function onResize(){ clearTimeout(_rz); _rz=setTimeout(()=>{ resize(); },120); }
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',onResize);
if(window.visualViewport) window.visualViewport.addEventListener('resize',onResize);

/* ---------- 상태 ---------- */
const G={
  grid:[],parity:0,stage:1,score:0,combo:0,
  mode:'theme',goal:'과일',pool:[],words:[],targets:[],done:{},
  cur:null,queue:[],
  fly:null,aim:null,dragging:false,
  particles:[],toasts:[],waves:[],pops:[],shake:0,flash:0,
  shooterY:0,maxRows:10,
  dryShots:0,swaps:3,hints:3,hintCells:null,bombs:2,rainbows:2,activeItem:null,
  wordsCompleted:0,freeGoal:8,
  locked:true,shots:0,trajA:null,trajPts:[],banner:null
};
const po=r=>(r+G.parity)&1;
const cellsIn=r=>po(r)===0?COLS:COLS-1;
const cx=(c,r)=>BX+R+c*2*R+(po(r)?R:0);
const cy=r=>BY+R+r*ROWH;

function nbrs(c,r){const o=po(r);
  return [[c-1,r],[c+1,r],[c-1+o,r-1],[c+o,r-1],[c-1+o,r+1],[c+o,r+1]];}
function at(c,r){
  if(r<0||r>=G.grid.length)return null;
  if(c<0||c>=cellsIn(r))return null;
  return G.grid[r][c];
}
const AXES=[
  {fwd:(c,r)=>[c+1,r],         back:(c,r)=>[c-1,r]},
  {fwd:(c,r)=>[c+po(r),r+1],   back:(c,r)=>[c-1+po(r),r-1]},
  {fwd:(c,r)=>[c-1+po(r),r+1], back:(c,r)=>[c+po(r),r-1]}
];

/* ---------- 스테이지 ---------- */
function buildFreeStage(){
  G.waves=[]; G.pops=[]; G.shake=0; G.flash=0;
  // 일반모드: 목표 없음. 매 스테이지 5개 카테고리 전체를 순환해 폭넓게 사용
  G.goal='자유';
  const cats=shuffle([...CATS]);
  // 카테고리당 최대 14개(사전 규모 30~38개 중 다수 커버), 매판 랜덤이라 스테이지마다 다른 단어 조합
  G.words=cats.flatMap(c=>shuffle(DICT_BY_CAT[c]).slice(0,14));
  // 보너스 합성어도 가끔 섞어 손맛 추가
  if(Math.random()<0.6){ const b=shuffle(BONUS_WORDS); G.words.push(...b.slice(0,3)); }
  // 일상 단어(생활)도 섞어서 노출 — 카테고리에 안 묶인 친숙한 단어들
  G.words.push(...shuffle(GENERIC_WORDS).slice(0,16));
  const syl=new Set(); for(const w of G.words) for(const ch of w) syl.add(ch);
  G.pool=[...syl]; mapColors(G.pool);
  G.targets=[]; G.done={};
  G.wordsCompleted=0; G.freeGoal=6+Math.floor((G.stage-1)*1.5);
  const rows=Math.min(G.maxRows,4);
  G.parity=0; G.grid=[];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let c=0;c<cellsIn(r);c++) row.push({s:pick(G.pool)});
    G.grid.push(row);
  }
  for(let i=0;i<3;i++) plantWord(pick(G.words.filter(w=>w.length<=3)),rows);
  G.cur=smartSyllable(); G.queue=[smartSyllable(),smartSyllable()];
  G.combo=0;G.dryShots=0;G.shots=0;G.hintCells=null;G.swaps=3;G.hints=3;G.bombs=2;G.rainbows=2;G.activeItem=null;
  syncUI();
}
function buildStage(){
  G.waves=[]; G.pops=[]; G.shake=0; G.flash=0;
  if(G.mode==='free'){ buildFreeStage(); return; }
  G.goal=CATS[(G.stage-1)%CATS.length];
  // 이번 스테이지 목표 단어 수: 3 → 5로 점증
  const nTarget=Math.min(5,3+Math.floor((G.stage-1)/2));
  // 초반엔 2글자, 후반엔 긴 단어도 섞기
  const catWords=DICT_BY_CAT[G.goal];
  const short=shuffle(catWords.filter(w=>w.length===2));
  const long=shuffle(catWords.filter(w=>w.length>=3));
  const bonus=shuffle(BONUS_WORDS.filter(w=>DICT_BY_CAT[G.goal].some(x=>w.includes(x))));
  let pickPool=[...short];
  if(G.stage>=3) pickPool=[...short.slice(0,3),...long];
  if(G.stage>=5 && bonus.length) pickPool.push(bonus[0]);
  G.targets=shuffle(pickPool).slice(0,nTarget);
  if(G.targets.length<nTarget) G.targets=[...G.targets,...shuffle(catWords).slice(0,nTarget-G.targets.length)];
  G.done={}; G.targets.forEach(w=>G.done[w]=false);

  const main=shuffle(DICT_BY_CAT[G.goal]).slice(0,7);
  const others=shuffle(CATS.filter(c=>c!==G.goal)).slice(0,2)
    .flatMap(c=>shuffle(DICT_BY_CAT[c]).slice(0,3));
  G.words=[...new Set([...G.targets,...main,...others])];
  const syl=new Set(); for(const w of G.words) for(const ch of w) syl.add(ch);
  G.pool=[...syl];
  mapColors(G.pool);

  const rows=Math.min(G.maxRows,4+Math.floor(G.stage/2));
  G.parity=0; G.grid=[];
  for(let r=0;r<rows;r++){
    const row=[];
    for(let c=0;c<cellsIn(r);c++) row.push({s:pick(G.pool)});
    G.grid.push(row);
  }
  const seeds=shuffle(G.targets.filter(w=>w.length<=3));
  for(let i=0;i<Math.min(2,seeds.length);i++) plantWord(seeds[i],rows);
  plantWord(pick(main),rows);

  G.cur=smartSyllable(); G.queue=[smartSyllable(),smartSyllable()];
  G.combo=0;G.dryShots=0;G.shots=0;G.hintCells=null;G.swaps=3;G.hints=3;G.bombs=2;G.rainbows=2;G.activeItem=null;
  syncUI();
}
function plantWord(w,rows){
  for(let t=0;t<40;t++){
    const ax=AXES[Math.floor(Math.random()*3)];
    let c=Math.floor(Math.random()*COLS),r=Math.floor(Math.random()*rows);
    if(!at(c,r))continue;
    const cells=[[c,r]]; let ok=true;
    for(let i=1;i<w.length;i++){
      [c,r]=ax.fwd(c,r);
      if(!at(c,r)){ok=false;break;}
      cells.push([c,r]);
    }
    if(!ok)continue;
    cells.forEach(([cc,rr],i)=>{G.grid[rr][cc].s=w[i];});
    const gap=Math.floor(Math.random()*w.length);
    const alt=G.pool.filter(s=>s!==w[gap]);
    if(alt.length) G.grid[cells[gap][1]][cells[gap][0]].s=pick(alt);
    return;
  }
}

/* ---------- 단어 판정 ---------- */
function lineOf(c0,r0,ax){
  const cells=[[c0,r0]]; let c=c0,r=r0;
  for(;;){[c,r]=ax.back(c,r); if(!at(c,r))break; cells.unshift([c,r]);}
  c=c0;r=r0;
  for(;;){[c,r]=ax.fwd(c,r); if(!at(c,r))break; cells.push([c,r]);}
  return cells;
}
function findWord(c0,r0,s){
  // 후보 전부 수집
  const cands=[];
  for(const ax of AXES){
    const cells=lineOf(c0,r0,ax);
    const str=cells.map(([c,r])=>(c===c0&&r===r0)?s:at(c,r).s).join('');
    const idx=cells.findIndex(([c,r])=>c===c0&&r===r0);
    for(let len=Math.min(MAXW,str.length);len>=2;len--){
      for(let st=Math.max(0,idx-len+1);st<=Math.min(idx,str.length-len);st++){
        const w=str.substr(st,len);
        if(DICT.has(w)){
          cands.push({word:w,cells:cells.slice(st,st+len),cat:DICT.get(w)});
        }else{
          // 역순도 사전에 있으면 인정 (같은 라인을 반대 방향으로 읽은 것)
          const rw=[...w].reverse().join('');
          if(rw!==w && DICT.has(rw)){
            cands.push({word:rw,cells:cells.slice(st,st+len),cat:DICT.get(rw)});
          }
        }
      }
    }
  }
  if(!cands.length) return null;
  if(G.mode==='theme'){
    // 주제모드: 아직 못 만든 목표 단어를 최우선, 그다음 최장
    const targetHit=cands.filter(c=>c.word in G.done && !G.done[c.word]);
    if(targetHit.length){ targetHit.sort((a,b)=>b.word.length-a.word.length); return targetHit[0]; }
  }
  // 일반모드(또는 목표 없음): 최장 우선
  cands.sort((a,b)=>b.word.length-a.word.length);
  return cands[0];
}
function openCells(){
  const out=[],seen=new Set();
  for(let r=0;r<G.grid.length;r++)
    for(let c=0;c<cellsIn(r);c++){
      if(!at(c,r))continue;
      for(const [nc,nr] of nbrs(c,r)){
        if(nr<0||nr>=G.maxRows)continue;
        if(nc<0||nc>=cellsIn(nr))continue;
        if(nr<G.grid.length&&G.grid[nr][nc])continue;
        const k=nc+','+nr; if(seen.has(k))continue;
        seen.add(k); out.push([nc,nr]);
      }
    }
  return out;
}
function completionsFor(s){
  const res=[];
  for(const [c,r] of openCells()){
    const w=findWord(c,r,s);
    if(w)res.push({c,r,...w});
  }
  return res;
}
function smartSyllable(){
  // 완성 가능한 글자를 훨씬 자주 제공 (체감 난이도 하향)
  if(Math.random()<0.92){
    const cands=shuffle(G.pool);
    let fallback=null;
    for(const s of cands){
      const hit=completionsFor(s);
      if(hit.length){
        if(G.mode==='free') return s;
        if(!fallback) fallback=s;  // 아무 완성이나 되는 첫 후보 저장 (폴백)
        // 정확히 "지금 남은 목표 단어"를 완성시키는 글자면 최우선 채택
        if(hit.some(h=>h.word in G.done && !G.done[h.word])) return s;
      }
    }
    if(fallback) return fallback;  // 목표 매칭 없어도 뭐라도 완성되면 그걸로
  }
  return pick(G.pool);
}
function ensureRow(r){
  while(G.grid.length<=r) G.grid.push(new Array(cellsIn(G.grid.length)).fill(null));
}

/* ---------- 발사 ---------- */
function shoot(angle){
  if(G.fly||G.locked)return;
  const sp=R*0.62;
  const item=G.activeItem;
  if(item==='bomb') G.bombs--;
  if(item==='rainbow') G.rainbows--;
  G.activeItem=null;
  G.fly={x:W/2,y:G.shooterY,vx:Math.cos(angle)*sp,vy:Math.sin(angle)*sp,s:G.cur,item};
  G.cur=G.queue.shift(); G.queue.push(smartSyllable());
  G.hintCells=null; G.trajA=null; G.shots++; syncUI();
}
function hitsBubble(x,y){
  for(let r=0;r<G.grid.length;r++)
    for(let c=0;c<cellsIn(r);c++){
      if(!at(c,r))continue;
      const dx=x-cx(c,r),dy=y-cy(r);
      if(dx*dx+dy*dy<(R*1.82)*(R*1.82))return true;
    }
  return false;
}
function stepFly(){
  const f=G.fly; if(!f)return;
  const steps=6;
  for(let i=0;i<steps;i++){
    f.x+=f.vx/steps; f.y+=f.vy/steps;
    // 벽 반사는 보드 영역(y<BY+BH) 안에서만 — 보드 밖 아래에선 직진
    if(f.y<BY+BH){
      if(f.x<BX+R){f.x=BX+R;f.vx*=-1;}
      if(f.x>BX+BW-R){f.x=BX+BW-R;f.vx*=-1;}
    }
    if(f.y<=BY+R){settle(f);return;}
    if(f.y<BY+BH && hitsBubble(f.x,f.y)){settle(f);return;}
  }
}
function bestSyllableAt(c,r){
  let best=null;
  for(const s of G.pool){
    const hit=findWord(c,r,s);
    if(hit && (!best || hit.word.length>best.word.length)) best={s,...hit};
  }
  return best;
}
function explodeAt(c,r){
  const cells=[[c,r],...nbrs(c,r).filter(([nc,nr])=>at(nc,nr))];
  G.locked=true;
  const t0=performance.now();
  cells.forEach(([cc,rr])=>{ if(G.grid[rr]&&G.grid[rr][cc]) G.grid[rr][cc].glow=t0; });
  setTimeout(()=>{
    let n=0;
    for(const [cc,rr] of cells){
      if(!G.grid[rr]||!G.grid[rr][cc])continue;
      const col=colorOf(G.grid[rr][cc].s)[0];
      burst(cx(cc,rr),cy(rr),col);
      addWave(cx(cc,rr),cy(rr),col,R*3);
      G.grid[rr][cc]=null; n++;
    }
    addShake(10); flash(0.22);
    G.score += n*80;
    G.combo=0; G.dryShots=0;
    toast('펑! +'+(n*80));
    dropFloaters(); G.locked=false; checkState(); syncUI();
  },260);
}
function settle(f){
  let best=null,bd=1e9;
  for(const [c,r] of openCells()){
    const d=(f.x-cx(c,r))**2+(f.y-cy(r))**2;
    if(d<bd){bd=d;best=[c,r];}
  }
  if(!best){
    ensureRow(0);
    for(let c=0;c<cellsIn(0);c++){
      if(G.grid[0][c])continue;
      const d=(f.x-cx(c,0))**2+(f.y-cy(0))**2;
      if(d<bd){bd=d;best=[c,0];}
    }
  }
  G.fly=null; if(!best)return;
  const [c,r]=best; ensureRow(r);
  if(f.item==='bomb'){
    G.grid[r][c]={s:f.s,born:performance.now()};
    SFX.stageClear();     // 통쾌한 폭발 사운드(팡파레 재활용)
    explodeAt(c,r);
    return;
  }
  let s=f.s;
  if(f.item==='rainbow'){
    const b=bestSyllableAt(c,r);
    if(b) s=b.s;
  }
  G.grid[r][c]={s,born:performance.now()};
  addShake(1.5); addWave(cx(c,r),cy(r),colorOf(s)[0],R*1.4);
  resolve(c,r);
}
function resolve(c,r){
  const hit=findWord(c,r,G.grid[r][c].s);
  if(hit){
    G.combo++; G.dryShots=0;
    const bonus=(G.mode==='theme'&&hit.cat===G.goal)?2:1;
    const gained=hit.word.length*hit.word.length*100*Math.min(G.combo,5)*bonus;
    G.score+=gained;
    if(hit.word in G.done && !G.done[hit.word]) G.done[hit.word]=true;
    G.wordsCompleted++;
    SAVE.coins=(SAVE.coins||0) + Math.max(2,hit.word.length) + (bonus>1?3:0);
    G.banner={text:hit.word,life:1,bonus:bonus>1};
    SFX.wordComplete(G.combo,bonus>1);
    // ── juice: 콤보/보너스에 비례한 임팩트 ──
    const combo=Math.min(G.combo,5);
    addShake(3+combo*1.2+(bonus>1?3:0));
    if(combo>=3||bonus>1) flash(0.12+combo*0.03);
    // 점수 팝업 (터진 자리 중심)
    let px=hit.cells.reduce((a,[c,r])=>a+cx(c,r),0)/hit.cells.length;
    let py=hit.cells.reduce((a,[c,r])=>a+cy(r),0)/hit.cells.length;
    addPop(px,py,'+'+gained, bonus>1?'#ffe08c':'#fff6d0');
    if(combo>=2) addPop(px,py-R*0.9,'콤보 x'+combo,'#ff9fd6');
    G.locked=true;
    const t0=performance.now();
    for(const [cc,rr] of hit.cells) G.grid[rr][cc].glow=t0;
    setTimeout(()=>{
      for(const [cc,rr] of hit.cells){
        if(!G.grid[rr]||!G.grid[rr][cc])continue;
        const col=colorOf(G.grid[rr][cc].s)[0];
        burst(cx(cc,rr),cy(rr),col);
        addWave(cx(cc,rr),cy(rr),col);
        G.grid[rr][cc]=null;
      }
      dropFloaters(); G.locked=false; checkState(); syncUI();
    },420);
  }else{
    G.combo=0; G.dryShots++;
    SFX.miss();
    if(G.dryShots>=5){G.dryShots=0;addRow();}
    checkState();
  }
  syncUI();
}
function dropFloaters(){
  const keep=new Set(),stack=[];
  if(G.grid[0])for(let c=0;c<cellsIn(0);c++) if(G.grid[0][c]){keep.add('0,'+c);stack.push([c,0]);}
  while(stack.length){
    const [c,r]=stack.pop();
    for(const [nc,nr] of nbrs(c,r)){
      if(!at(nc,nr))continue;
      const k=nr+','+nc; if(keep.has(k))continue;
      keep.add(k); stack.push([nc,nr]);
    }
  }
  for(let r=0;r<G.grid.length;r++)
    for(let c=0;c<cellsIn(r);c++){
      if(!at(c,r))continue;
      if(!keep.has(r+','+c)){
        burst(cx(c,r),cy(r),colorOf(G.grid[r][c].s)[0]);
        G.score+=50; G.grid[r][c]=null;
      }
    }
}
function addRow(){
  SFX.rowAdd();
  G.parity^=1;
  const row=[];
  for(let c=0;c<cellsIn(0);c++) row.push({s:pick(G.pool)});
  G.grid.unshift(row);
  toast('새 줄이 내려왔어요!');
}
function checkState(){
  let count=0,lowest=-1;
  for(let r=0;r<G.grid.length;r++)
    for(let c=0;c<cellsIn(r);c++)
      if(at(c,r)){count++;lowest=Math.max(lowest,r);}
  if(count===0){win();return;}
  if(G.mode==='theme'){
    const allDone=G.targets.length && G.targets.every(w=>G.done[w]);
    if(allDone){win();return;}
  }else if(G.mode==='free'){
    if(G.wordsCompleted>=G.freeGoal){win();return;}
  }
  if(cy(lowest)+R>BY+BH) lose();
}

/* ---------- 이펙트 ---------- */
function addShake(amt){ G.shake=Math.min(G.shake+amt, 14); }
function addWave(x,y,col,maxR){ G.waves.push({x,y,col,r:R*0.3,maxR:maxR||R*2.4,life:1}); }
function addPop(x,y,text,col){ G.pops.push({x,y,text,col:col||'#fff6d0',life:1,vy:-1.2}); }
function flash(a){ G.flash=Math.max(G.flash,a); }
function burst(x,y,col){
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2,sp=1+Math.random()*4.5;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,life:1,col,r:2+Math.random()*4});
  }
  blip();
}
function toast(text,cells){
  let x=W/2,y=H*0.34;
  if(cells&&cells.length){
    x=cells.reduce((a,[c,r])=>a+cx(c,r),0)/cells.length;
    y=cells.reduce((a,[c,r])=>a+cy(r),0)/cells.length;
  }
  G.toasts.push({text,x,y,life:1});
}
let actx=null;
function getActx(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); return actx; }catch(e){ return null; }
}
function soundOn(){ return SAVE.soundOn!==false; }
function tone(freq0,freq1,dur,gain,type,delay){
  if(!soundOn())return;
  const ax=getActx(); if(!ax)return;
  try{
    const t0=ax.currentTime+(delay||0);
    const o=ax.createOscillator(),g=ax.createGain();
    o.type=type||'triangle';
    o.frequency.setValueAtTime(freq0,t0);
    if(freq1) o.frequency.exponentialRampToValueAtTime(freq1,t0+dur*0.55);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain,t0+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(ax.destination);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
const SFX={
  pop(){ tone(520+Math.random()*260,880,0.17,0.07,'triangle'); },
  click(){ tone(700,900,0.06,0.05,'square'); },
  wordComplete(combo,bonus){
    // 콤보가 높을수록, 목표 보너스면 더 화려한 3음 아르페지오
    const base=440+Math.min(combo,5)*40;
    const ratios=bonus?[1,1.26,1.5,2]:[1,1.26,1.5];
    ratios.forEach((r,i)=>tone(base*r,base*r*1.15,0.22,0.09,'triangle',i*0.045));
  },
  miss(){ tone(260,180,0.14,0.045,'sine'); },
  rowAdd(){ tone(180,120,0.3,0.06,'sawtooth'); },
  stageClear(){
    [0,1,2,3].forEach(i=>tone(523.25*Math.pow(2,i/12*4), null, 0.28,0.08,'triangle',i*0.11));
  },
  gameOver(){ tone(300,90,0.6,0.08,'sawtooth'); },
  buy(){ tone(700,1100,0.14,0.07,'triangle'); tone(1050,1400,0.16,0.06,'triangle',0.06); }
};
function blip(){ SFX.pop(); }

/* ---------- 에셋 ---------- */
const ASSET_SRC={ scene:'assets/scene.svg', cannon:'assets/cannon.png' };
const ASSETS={};
function loadAssets(){
  return Promise.all(Object.entries(ASSET_SRC).map(([k,src])=>new Promise(res=>{
    const i=new Image();
    i.onload=()=>{ASSETS[k]=i;res();};
    i.onerror=()=>{console.warn('asset 로드 실패:',k);res();};
    i.src=src;
  })));
}

/* ---------- 드로잉 ---------- */
function roundRect(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function neon(col,blur,w,fn){
  ctx.save();
  ctx.strokeStyle=col; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor=col; ctx.shadowBlur=blur*1.6; fn();
  ctx.shadowBlur=blur*.7; fn();
  ctx.restore();
}
function drawBubbleRaw(x,y,r,s,glow){
  const [c1,c2]=colorOf(s);
  ctx.save();
  // 안쪽 어둡게 + 은은한 색 채움
  ctx.beginPath();ctx.arc(x,y,r*.94,0,7);
  const g=ctx.createRadialGradient(x,y,r*.1,x,y,r);
  g.addColorStop(0,'rgba(6,9,30,.94)');g.addColorStop(.6,'rgba(9,13,38,.90)');g.addColorStop(1,c2+'55');
  ctx.fillStyle=g;ctx.fill();
  ctx.restore();
  const lw=Math.max(1.5,r*.075);
  const ring=()=>{ctx.beginPath();ctx.arc(x,y,r*.94,0,7);ctx.stroke();};
  // 링: 바깥쪽 글로우 한 번 → 선명한 선 한 번
  neon(c1,glow?r*1.2:r*.5,lw,ring);
  ctx.save();
  ctx.strokeStyle=glow?'#fff4cf':c1; ctx.lineWidth=lw*.9; ring();
  ctx.restore();

  // 글자: 글로우 한 겹만 뒤에 깔고, 마지막은 블러 0으로 또렷하게
  ctx.save();
  ctx.font=`800 ${r*1.04}px 'Pretendard', sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  const ty=y+r*.06, hal=glow?'#ffe9a0':c1;
  // 글로우 한 겹(뒤) + 선명한 흰 글자(앞) — 겹쳐찍기 없이 균일
  ctx.shadowColor=hal; ctx.shadowBlur=r*.5;
  ctx.fillStyle=hal; ctx.fillText(s,x,ty);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff'; ctx.fillText(s,x,ty);
  ctx.restore();
}
const SPR=new Map();
let FONTS_READY=false;
function sprite(s,r,glow){
  const key=s+'|'+r+'|'+(glow?1:0);
  let c=SPR.get(key); if(c)return c;
  const pad=Math.ceil(r*(glow?2.0:1.55)), size=pad*2;
  c=document.createElement('canvas');
  c.width=Math.ceil(size*DPR); c.height=Math.ceil(size*DPR);
  const g2=c.getContext('2d'); g2.setTransform(DPR,0,0,DPR,0,0);
  const keep=ctx; ctx=g2; drawBubbleRaw(pad,pad,r,s,glow); ctx=keep;
  c._pad=pad;
  if(FONTS_READY){ if(SPR.size>320)SPR.clear(); SPR.set(key,c); }
  return c;
}
function bubble(x,y,r,s,glow){
  r=Math.round(r*2)/2;
  const c=sprite(s,r,glow);
  ctx.drawImage(c,x-c._pad,y-c._pad,c._pad*2,c._pad*2);
}

/* 보드 안쪽 네온 풍경 (에셋) */
function drawScenery(){
  const img=ASSETS.scene; if(!img)return;
  ctx.save();
  roundRect(BX,BY,BW,BH,26); ctx.clip();
  const w=BW*1.04, h=w*(img.height/img.width);
  ctx.drawImage(img, BX-BW*.02, BY+BH-h+R*.15, w, h);
  ctx.restore();
}
let BOARDLAYER=null;
function drawBoard(){
  if(!BOARDLAYER){
    const c=document.createElement('canvas');
    c.width=Math.ceil(W*DPR); c.height=Math.ceil(H*DPR);
    const g2=c.getContext('2d'); g2.setTransform(DPR,0,0,DPR,0,0);
    const keep=ctx; ctx=g2; drawBoardRaw(); ctx=keep;
    BOARDLAYER=c;
  }
  ctx.drawImage(BOARDLAYER,0,0,W,H);
}
function drawBoardRaw(){
  const x=BX-FRAME,y=BY-FRAME,w=BW+FRAME*2,h=BH+FRAME*2;
  ctx.save();
  roundRect(x,y,w,h,30);
  ctx.fillStyle='rgba(10,14,44,.45)';ctx.fill();
  ctx.restore();
  neon('#5fd8ff',16,3,()=>{roundRect(x,y,w,h,30);ctx.stroke();});
  drawScenery();
}
const CANNON_W=6.4, CANNON_OFF=0.35;   // PNG 대포: 발사버블 하단에 밀착
function drawShooter(now){
  const img=ASSETS.cannon, sy=G.shooterY, x=W/2;
  if(img){
    const w=R*CANNON_W, h=w*(img.height/img.width);
    ctx.drawImage(img, x-w/2, sy+R*CANNON_OFF, w, h);
  }
  if(!G.fly&&G.cur){
    const bob=Math.sin(now/420)*R*.05;
    bubble(x,sy+bob,R*.94,G.cur);
    if(G.activeItem){
      const icon=G.activeItem==='bomb'?'💣':'🌈';
      ctx.save();
      ctx.font=`${R*.62}px sans-serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(icon, x+R*0.78, sy+bob-R*0.78);
      ctx.restore();
    }
  }
}
function renderTargetBar(){
  const bar=document.getElementById('targetBar');
  if(!bar)return;
  if(G.mode==='theme'&&G.targets.length){
    bar.style.display='flex';
    bar.innerHTML=G.targets.map(w=>`<span class="tchip${G.done[w]?' done':''}">${G.done[w]?'✓ ':''}${w}</span>`).join('');
  }else if(G.mode==='free'){
    bar.style.display='flex';
    const pct=Math.min(100,Math.round(G.wordsCompleted/G.freeGoal*100));
    bar.innerHTML=`<span class="tchip${G.wordsCompleted>=G.freeGoal?' done':''}">목표: 단어 ${G.wordsCompleted}/${G.freeGoal}개 완성</span>`;
  }else{
    bar.style.display='none'; bar.innerHTML='';
  }
}
function drawQueue(){
  if(!G.queue.length)return;
  const x=W-R*1.8,y=G.shooterY-R*0.1,r=R*.82;
  ctx.save();
  ctx.font=`700 ${R*.52}px 'Pretendard', sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#9fe8ff';ctx.shadowColor='#5fd8ff';ctx.shadowBlur=10;
  ctx.fillText('다음: '+G.queue[0],x,y-r*1.5);
  ctx.restore();
  neon('#5fd8ff',10,2,()=>{ctx.beginPath();ctx.arc(x,y,r*1.12,0,7);ctx.stroke();});
  bubble(x,y,r*.92,G.queue[0]);
}
function trajectory(angle){
  let x=W/2,y=G.shooterY,vx=Math.cos(angle)*R*.62,vy=Math.sin(angle)*R*.62;
  const pts=[];
  for(let i=0;i<200;i++){
    x+=vx;y+=vy;
    if(y<BY+BH){ if(x<BX+R){x=BX+R;vx*=-1;} if(x>BX+BW-R){x=BX+BW-R;vx*=-1;} }
    if(y<=BY+R)break;
    if(y<BY+BH&&hitsBubble(x,y))break;
    if(i%4===0)pts.push([x,y]);
  }
  return pts;
}
function draw(now){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(G.shake>0.3){
    const dx=(Math.random()-0.5)*G.shake, dy=(Math.random()-0.5)*G.shake;
    ctx.translate(dx,dy);
  }
  drawBoard();

  if(G.aim!=null&&!G.fly&&!G.locked){
    if(G.trajA!==G.aim){G.trajA=G.aim;G.trajPts=trajectory(G.aim);}
    const pts=G.trajPts;
    ctx.save();ctx.fillStyle='#8fe6ff';ctx.shadowColor='#5fd8ff';ctx.shadowBlur=10;
    pts.forEach((p,i)=>{ctx.beginPath();ctx.arc(p[0],p[1],R*.13*(1-i/pts.length*.5),0,7);ctx.fill();});
    if(pts.length>2){
      const a=pts[pts.length-1],b2=pts[pts.length-2];
      const ang=Math.atan2(a[1]-b2[1],a[0]-b2[0]);
      ctx.translate(a[0],a[1]);ctx.rotate(ang+Math.PI/2);
      ctx.beginPath();
      ctx.moveTo(0,-R*.42);ctx.lineTo(R*.30,R*.18);ctx.lineTo(-R*.30,R*.18);
      ctx.closePath();ctx.fill();
    }
    ctx.restore();
  }
  if(G.hintCells){
    ctx.save();
    const pulse=.5+.5*Math.sin(now/180);
    ctx.strokeStyle=`rgba(255,232,140,${.5+pulse*.5})`;ctx.shadowColor='#ffe08c';ctx.shadowBlur=14;
    ctx.lineWidth=4;ctx.setLineDash([7,7]);
    for(const [c,r] of G.hintCells){ctx.beginPath();ctx.arc(cx(c,r),cy(r),R*1.05,0,7);ctx.stroke();}
    ctx.restore();
  }

  for(let r=0;r<G.grid.length;r++)
    for(let c=0;c<cellsIn(r);c++){
      const b=at(c,r); if(!b)continue;
      let rr=R*.94;
      if(b.born){const t=Math.min(1,(now-b.born)/220);rr=R*.94*(.62+.38*t+.12*Math.sin(t*Math.PI));}
      bubble(cx(c,r),cy(r),rr,b.s,!!b.glow);
    }
  if(G.fly)bubble(G.fly.x,G.fly.y,R*.94,G.fly.s);

  for(const p of G.particles){
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=p.col;ctx.shadowColor=p.col;ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;

  drawShooter(now);
  drawQueue();

  if(G.banner){
    const b=G.banner, t=1-b.life;
    const pop=t<.18?(t/.18):1;
    const fs=Math.min(R*2.0,BW/(b.text.length+0.45))*(0.72+0.28*pop)*(1+(1-b.life)*0.06);
    const col=b.bonus?'#ffd86f':'#ff8fdc';
    ctx.save();
    ctx.globalAlpha=Math.min(1,b.life*2.2);
    ctx.translate(W/2,BY+R*1.25-(1-b.life)*R*.8);
    ctx.font=`800 ${fs}px 'Pretendard', sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.shadowColor=col;ctx.shadowBlur=fs*.55;
    ctx.fillStyle=col;ctx.fillText(b.text,0,0);ctx.fillText(b.text,0,0);
    ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff';ctx.fillText(b.text,0,0);
    ctx.restore();
  }
  // ── 링 웨이브 ──
  for(const w of G.waves){
    ctx.save();
    ctx.globalAlpha=Math.max(0,w.life)*0.6;
    ctx.strokeStyle=w.col; ctx.shadowColor=w.col; ctx.shadowBlur=14;
    ctx.lineWidth=Math.max(1.5,3*w.life);
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,7); ctx.stroke();
    ctx.restore();
  }
  // ── 점수 팝업 ──
  for(const p of G.pops){
    ctx.save();
    ctx.globalAlpha=Math.min(1,p.life*1.5);
    ctx.translate(p.x, p.y+(1-p.life)*-30);
    const fs=R*0.7*(0.85+(1-p.life)*0.35);
    ctx.font=`800 ${fs}px 'Pretendard', sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=fs*0.6;
    ctx.fillText(p.text,0,0);
    ctx.restore();
  }
  for(const t of G.toasts){
    ctx.save();
    ctx.globalAlpha=Math.min(1,t.life*1.6);
    ctx.translate(t.x,t.y-(1-t.life)*62);
    const fs=R*.74*(1+(1-t.life)*.25);
    ctx.font=`800 ${fs}px 'Pretendard', sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle='#fff6d0';ctx.shadowColor='#ffd86f';ctx.shadowBlur=fs*.7;
    ctx.fillText(t.text,0,0);ctx.fillText(t.text,0,0);
    ctx.restore();
  }
  ctx.restore();  // shake 종료
  // ── 풀스크린 플래시 ──
  if(G.flash>0.01){
    ctx.save();
    ctx.globalAlpha=G.flash;
    ctx.fillStyle='#ffffff';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
}
function tick(now){
  stepFly();
  for(const p of G.particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.life-=.028;}
  G.particles=G.particles.filter(p=>p.life>0);
  if(G.banner){G.banner.life-=.0085;if(G.banner.life<=0)G.banner=null;}
  for(const t of G.toasts)t.life-=.012;
  G.toasts=G.toasts.filter(t=>t.life>0);
  // juice 감쇠/업데이트
  G.shake*=0.82; if(G.shake<0.3)G.shake=0;
  G.flash*=0.86; if(G.flash<0.01)G.flash=0;
  for(const w of G.waves){ w.r+=(w.maxR-w.r)*0.18; w.life-=0.05; }
  G.waves=G.waves.filter(w=>w.life>0);
  for(const p of G.pops){ p.y+=p.vy; p.vy*=0.94; p.life-=0.022; }
  G.pops=G.pops.filter(p=>p.life>0);
  draw(now);
  requestAnimationFrame(tick);
}

function aimAt(px,py){
  const dx=px-W/2,dy=py-G.shooterY;
  let a=Math.atan2(dy,dx);
  const lim=.22;
  if(a>-lim)a=-lim;
  if(a<-Math.PI+lim)a=-Math.PI+lim;
  G.aim=a;
}
function localPt(e){
  const rect=cv.getBoundingClientRect();
  return [e.clientX-rect.left,e.clientY-rect.top];
}
cv.addEventListener('pointerdown',e=>{G.dragging=true;aimAt(...localPt(e));});
cv.addEventListener('pointermove',e=>{if(G.dragging)aimAt(...localPt(e));});
cv.addEventListener('pointerup',()=>{
  if(!G.dragging)return;
  G.dragging=false;
  if(G.aim!=null)shoot(G.aim);
  G.aim=null;
});
cv.addEventListener('pointercancel',()=>{G.dragging=false;G.aim=null;});

    <p>점수 <b>${G.score.toLocaleString()}</b></p>
    <button class="btn" id="go">다음 스테이지</button>`);
  document.getElementById('go').onclick=()=>{SFX.click();G.stage++;hide();G.locked=false;buildStage();saveGame(true);};
}
function reviveBoard(){
  // 바닥에 가장 가까운(위험한) 줄부터 2줄 제거해 숨통 트기
  for(let i=0;i<2 && G.grid.length>0;i++) G.grid.pop();
  BOARDLAYER=null;
  toast('❤️ 부활! 아래 두 줄이 사라졌어요');
  checkState();
  syncUI();
}
function lose(){
  G.locked=true;
  SFX.gameOver();
  const canRevive=(SAVE.revives||0)>0;
  show(`<h2>아쉬워요!</h2>
    <p>버블이 바닥까지 내려왔어요.<br>스테이지 ${G.stage} · ${G.score.toLocaleString()}점</p>
    ${canRevive?`<button class="btn" id="revive" style="border-color:#ff6b81;color:#ffe0e6;text-shadow:0 0 10px #ff6b81;box-shadow:0 0 16px rgba(255,107,129,.55),inset 0 0 14px rgba(255,107,129,.25);margin-top:14px">❤️ 부활권 사용 (보유 ${SAVE.revives})</button>`:''}
    <button class="btn" id="go" style="margin-top:${canRevive?10:16}px">다시 하기</button>`);
  if(canRevive){
    document.getElementById('revive').onclick=()=>{
      SFX.buy();
      SAVE.revives--; saveGame(true);
      hide(); G.locked=false;
      reviveBoard();
    };
  }
  document.getElementById('go').onclick=()=>{hide();G.locked=false;G.score=0;buildStage();};
}
function intro(){
  const hasFree = SAVE.free && (SAVE.free.stage>1 || SAVE.free.score>0);
  const hasTheme = SAVE.theme && (SAVE.theme.stage>1 || SAVE.theme.score>0);
  const bestLine = (SAVE.free.bestScore||SAVE.theme.bestScore)
    ? `<p style="font-size:13px;opacity:.75;margin-top:6px">최고점수 · 주제 ${(SAVE.theme.bestScore||0).toLocaleString()} / 챌린지 ${(SAVE.free.bestScore||0).toLocaleString()}</p>`
    : '';
  show(`<h2>낱글자 팡팡!</h2>
    <p>버블을 쏘아 <b>가로·대각선</b>으로<br>낱글자를 이어 단어를 만들면 팡!</p>
    ${bestLine}
    <p style="margin-top:14px">모드를 골라주세요</p>
    <button class="btn" id="mTheme" style="display:block;margin:12px auto 0;font-size:20px;padding:14px 32px">📚 주제 모드${hasTheme?` <span style="font-size:12px;opacity:.8">이어하기 S${SAVE.theme.stage}</span>`:''}</button>
    <p style="font-size:13px;opacity:.7;margin:4px 0 0">주제별 목표 단어를 완성하며 배우기</p>
    <button class="btn" id="mFree" style="border-color:#ff8fdc;text-shadow:0 0 8px #ff8fdc;box-shadow:0 0 12px rgba(255,143,220,.4),inset 0 0 10px rgba(255,143,220,.18);display:block;margin:16px auto 0;font-size:15px;padding:9px 20px;opacity:.85">🎯 챌린지 모드${hasFree?` <span style="font-size:11px;opacity:.8">이어하기 S${SAVE.free.stage}</span>`:''}</button>
    <p style="font-size:12px;opacity:.6;margin:4px 0 0">아무 단어나 자유롭게, 빠르게 점수 쌓기</p>
    ${(hasFree||hasTheme)?'<p style="font-size:12px;opacity:.55;margin-top:10px">버튼을 누르면 저장된 진행에서 이어집니다</p>':''}`);
  document.getElementById('mFree').onclick=()=>{ SFX.click(); G.mode='free'; hide(); startGame(hasFree); };
  document.getElementById('mTheme').onclick=()=>{ SFX.click(); G.mode='theme'; hide(); startGame(hasTheme); };
}
function startGame(resume){
  if(resume){
    const slot=SAVE[G.mode];
    G.stage=slot?Math.max(1,slot.stage):1;
    G.score=slot?(slot.score||0):0;
  }else{
    G.stage=1; G.score=0;
  }
  buildStage(); G.locked=false; saveGame(true);
}

/* ---------- 저장 (localStorage) ---------- */
const SAVE_KEY='pangpop_save_v1';
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const d=JSON.parse(raw);
    if(!d.free) d.free={stage:1,score:0,bestScore:0,bestStage:1};
    if(!d.theme) d.theme={stage:1,score:0,bestScore:0,bestStage:1};
    if(typeof d.coins!=='number') d.coins=0;
    if(typeof d.revives!=='number') d.revives=0;
    return d;
  }catch(e){ return null; }
}
let SAVE = loadSave() || {
  free:{stage:1,score:0,bestScore:0,bestStage:1},
  theme:{stage:1,score:0,bestScore:0,bestStage:1},
  lastMode:'theme', coins:0, revives:0
};
let _saveTimer=null;
function saveGame(immediate){
  const write=()=>{
    try{
      const slot=SAVE[G.mode]||(SAVE[G.mode]={stage:1,score:0,bestScore:0,bestStage:1});
      slot.stage=G.stage; slot.score=G.score;
      slot.bestScore=Math.max(slot.bestScore||0, G.score);
      slot.bestStage=Math.max(slot.bestStage||1, G.stage);
      SAVE.lastMode=G.mode;
      localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE));
    }catch(e){}
  };
  if(immediate){ clearTimeout(_saveTimer); write(); }
  else{ clearTimeout(_saveTimer); _saveTimer=setTimeout(write,500); }
}

/* ---------- 유틸 ---------- */
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function syncMuteBtn(){
  const b=document.getElementById('btnMute');
  if(b) b.textContent = soundOn() ? '🔊' : '🔇';
}
document.getElementById('btnMute').onclick=()=>{
  SAVE.soundOn = !soundOn();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){}
  syncMuteBtn();
  if(soundOn()) SFX.click();
};

/* ---------- 시작 ---------- */
function boot(){
  syncMuteBtn();
  resize();
  // 모드 선택 전: 배경만 보이도록 빈 상태로 시작
  G.grid=[]; G.targets=[]; G.cur=null; G.queue=[];
  G.locked=true; intro();
  requestAnimationFrame(tick);
  loadAssets().then(()=>{ BOARDLAYER=null; });
}
function markFontsReady(){ FONTS_READY=true; SPR.clear(); BOARDLAYER=null; }
if(document.fonts&&document.fonts.ready){
  boot();
  // Pretendard 실제 로드 확인 후 캐시 활성화
  const need=[document.fonts.load("800 20px 'Pretendard'"),
              document.fonts.load("700 20px 'Pretendard'")];
  Promise.all(need).then(()=>document.fonts.ready).then(markFontsReady)
    .catch(()=>{ setTimeout(markFontsReady,800); });
  // 안전장치: 2초 후엔 무조건 활성화
  setTimeout(()=>{ if(!FONTS_READY) markFontsReady(); },2000);
} else { window.addEventListener('load',()=>{ boot(); setTimeout(markFontsReady,600); }); }
</script>
</body>
</html>

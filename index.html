<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- 1. 화면 100%를 꽉 채우는 순수 배경 (어떤 기기든 완벽 대응) -->
  <div id="bgLayer"></div>

  <!-- 2. 화면 맨 위에 딱 붙는 상단 UI (지붕 패널) -->
  <div id="topUI">
    <div class="top-menu-row">
      <button class="icon-btn" id="btnMenu">❚❚</button>
      <button class="icon-btn" id="btnMute">🔊</button>
      <div class="stat-pill">❤️<b id="uiLives">6</b></div>
      <div class="stat-pill">💰<b id="uiCoins">0</b></div>
    </div>
    <div class="top-board-row">
      <div class="side-info">스테이지<br><b id="uiStage" class="big-num">1</b></div>
      <div class="center-info">
        <div class="target-title">목표 단어</div>
        <div id="targetBar"></div>
      </div>
      <div class="side-info">점수<br><b id="uiScoreBig" class="big-num">0</b></div>
    </div>
  </div>

  <!-- 3. 버블이 날아다니는 진짜 게임 구역 (상하단 사이 남는 공간 100% 활용) -->
  <div id="gameArea">
    <canvas id="cv"></canvas>
  </div>

  <!-- 4. 화면 맨 아래 딱 붙는 하단 UI (아이템 패널) -->
  <div id="bottomUI">
    <button class="item-btn" id="btnHint">💡<b id="uiHint">3</b></button>
    <button class="item-btn" id="btnSwap">🔄<b id="uiSwap">3</b></button>
    <button class="item-btn" id="btnBomb">💣<b id="uiBomb">2</b></button>
    <button class="item-btn" id="btnRainbow">🌈<b id="uiRainbow">2</b></button>
  </div>

  <!-- 지도 및 팝업창 모달 -->
  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  <div id="mapVeil"><div id="mapScroll"></div><div id="mapLives"></div><div id="seasonTabs"></div></div>
</div>

<script src="game.js"></script>
</body>
</html>

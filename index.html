<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0604">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- 게임 스테이지 박스 -->
  <div id="stage">
    <!-- 두루마리 점수판 -->
    <div id="scoreScroll"><b id="uiScoreBig">0</b></div>
    <!-- 찰흙 게임 캔버스 -->
    <canvas id="cv"></canvas>
    
    <!-- ✨ 핵심: 비율이 절대 안 깨지는 UI 레이어 -->
    <div id="uiLayer">
      <div id="topTier">
        <div class="left-buttons">
          <button class="icon-btn" id="btnMenu">❚❚</button>
          <button class="icon-btn" id="btnMute">🔊</button>
          <button class="icon-btn" id="btnShop">🛒</button>
        </div>
        <div class="right-stats">
          <div class="stat-pill">❤️<b id="uiLives">6</b></div>
          <div class="stat-pill">S<b id="uiStage">1</b></div>
          <div class="stat-pill">💰<b id="uiCoins">0</b></div>
        </div>
      </div>
      <div id="targetBar"></div>
      <div id="bottomTier">
        <button class="item-btn" id="btnHint">💡<b id="uiHint">3</b></button>
        <button class="item-btn" id="btnSwap">🔄<b id="uiSwap">3</b></button>
        <button class="item-btn" id="btnBomb">💣<b id="uiBomb">2</b></button>
        <button class="item-btn" id="btnRainbow">🌈<b id="uiRainbow">2</b></button>
      </div>
    </div>
  </div>

  <!-- 지도 및 모달창 -->
  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  <div id="mapVeil"><div id="mapScroll"></div><div id="mapLives"></div><div id="seasonTabs"></div></div>
</div>

<script src="game.js"></script>
</body>
</html>

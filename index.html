<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f8ecd2">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<!-- 👇 1번에서 만든 디자인 파일(style.css)을 여기서 불러옵니다 -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
<div id="scoreScroll"><b id="uiScoreBig">0</b></div>
<header>
  <div style="display:flex;align-items:center;gap:6px">
    <button class="np" id="btnMenu" style="padding:7px 12px">❚❚</button>
    <button class="np" id="btnMute" style="padding:7px 12px">🔊</button>
    <button class="np" id="btnShop" style="padding:7px 12px">🛒</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px;font-size:13px">
    <span class="hl" style="font-size:13px">❤️<b id="uiLives">6</b></span>
    <span class="hl" style="font-size:13px">S<b id="uiStage">1</b></span>
    <span class="hl" style="font-size:13px">💰<b id="uiCoins">0</b></span>
  </div>
</header>
<div id="goalBar">
  <span class="glabel" id="uiGoal">과일</span>
  <div class="gtrack"><i id="comboBar" style="width:0%"></i></div>
  <span class="gcombo">x<b id="uiCombo">1</b></span>
</div>
<div id="targetBar"></div>

<div id="stage">
  <canvas id="cv"></canvas>
  
<div id="stage">
  <canvas id="cv"></canvas>
  
  <!-- 👇 하단 중앙 아이템 바 (4개 가로 나열) -->
  <div id="bottomItemBar">
    <button class="fab" id="btnHint">💡 <b id="uiHint">3</b></button>
    <button class="fab" id="btnSwap">🔄 <b id="uiSwap">3</b></button>
    <button class="fab" id="btnBomb">💣 <b id="uiBomb">2</b></button>
    <button class="fab" id="btnRainbow">🌈 <b id="uiRainbow">2</b></button>
  </div>
</div>
<div class="veil" id="veil"><div class="card" id="card"></div></div>
<div id="mapVeil"><div id="mapScroll"></div><div id="mapLives"></div><div id="seasonTabs"></div></div>
</div>

<!-- 👇 배경음악 오디오 (무료 퍼즐 게임 BGM 링크를 임시로 연결해두었습니다) -->
<audio id="bgmAudio" loop>
  <source src="https://assets.mixkit.co/music/preview/mixkit-funny-puzzle-game-467.mp3" type="audio/mpeg">
</audio>

<!-- 👇 3번에서 만들 자바스크립트 파일(game.js)을 여기서 불러옵니다 -->
<script src="game.js"></script>
</body>
</html>

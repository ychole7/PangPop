<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>낱글자 팡팡 - 스테이지 맵</title>
<style>
  :root{
    --cream:#f4ecd8; --dark:#2a241b; --khaki:#8a7a55;
    --locked:#9a9184; --locked-b:#6b6357;
    --cleared:#e8b23a; --cleared-b:#a9761a;
    --current:#ff8a3d; --current-b:#c2531a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:#000; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; overscroll-behavior:none;}

  #shell{max-width:480px; margin:0 auto; background:var(--dark); min-height:100vh; position:relative;}

  #topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:linear-gradient(180deg,#2a241b 80%, transparent);
  }
  #topbar .chTitle{color:var(--cream); font-weight:800; font-size:15px;}
  #topbar .navBtns{display:flex; gap:6px;}
  #topbar button{
    background:rgba(255,255,255,.12); border:1px solid var(--khaki); color:var(--cream);
    border-radius:16px; padding:5px 12px; font-size:12px; cursor:pointer;
  }
  #topbar button:disabled{opacity:.3; cursor:default;}

  #mapScroll{position:relative; width:100%;}
  .chapterPanel{position:relative; width:100%; display:none;}
  .chapterPanel.active{display:block;}

  /* mapCanvas keeps a fixed aspect-ratio matching the source image exactly,
     so xPct/yPct always line up with the art regardless of what else is
     rendered below it (title, stage count, etc). Never add flow content
     inside mapCanvas itself. */
  .mapCanvas{position:relative; width:100%;}
  .mapCanvas img.bg{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover;}

  .connector{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  .connector line{stroke:rgba(255,255,255,.55); stroke-width:.6; stroke-dasharray:1.6 1.4;}

  .node{
    position:absolute; width:6.4%; aspect-ratio:1/1; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .node .stoneImg{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));
  }
  .node.locked .stoneImg{filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)) brightness(.55) saturate(.4);}
  .node.current .stoneImg{filter:drop-shadow(0 0 7px rgba(255,170,80,.95)) drop-shadow(0 2px 3px rgba(0,0,0,.5));}

  .node .label{
    position:relative; z-index:3; font-size:9px; font-weight:800; color:#3a2a12;
    text-shadow:0 1px 1px rgba(255,255,255,.6); pointer-events:none;
  }
  .node.locked .label{color:#e8e0cc; text-shadow:0 1px 2px rgba(0,0,0,.7);}
  .node.current .label{color:#fff; font-size:10px; text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .node .star{font-size:11px;}

  #chapterEndCap{
    text-align:center; color:var(--khaki); font-size:11px; padding:10px 0 4px;
  }
</style>
</head>
<body>

<div id="shell">
  <div id="topbar">
    <div class="navBtns">
      <button id="prevBtn">◀ 이전</button>
    </div>
    <div class="chTitle" id="chTitle">1챕터</div>
    <div class="navBtns">
      <button id="nextBtn">다음 ▶</button>
    </div>
  </div>

  <div id="mapScroll"></div>
</div>

<script>
const ASSET_PATHS = {
  bg: { "1": "assets/bg_ch1.webp", "2": "assets/bg_ch2.webp", "3": "assets/bg_ch3.webp", "4": "assets/bg_ch4.webp" },
  stoneLocked: "assets/stone_default.png",
  stoneCurrent: "assets/stone_default.png",
  stoneCleared: "assets/stone_clear.png"
};
const STAGE_DATA = [{"chapter": 1, "imageNaturalSize": {"width": 941, "height": 1672}, "stages": [{"stage": 1, "xPct": 58.33, "yPct": 97.24}, {"stage": 2, "xPct": 64.43, "yPct": 90.46}, {"stage": 3, "xPct": 51.48, "yPct": 86.59}, {"stage": 4, "xPct": 36.81, "yPct": 83.79}, {"stage": 5, "xPct": 37.76, "yPct": 78.3}, {"stage": 6, "xPct": 52.81, "yPct": 76.47}, {"stage": 7, "xPct": 66.52, "yPct": 73.45}, {"stage": 8, "xPct": 56.05, "yPct": 67.86}, {"stage": 9, "xPct": 41.38, "yPct": 65.28}, {"stage": 10, "xPct": 45.57, "yPct": 59.14}, {"stage": 11, "xPct": 58.33, "yPct": 54.73}, {"stage": 12, "xPct": 47.67, "yPct": 49.13}, {"stage": 13, "xPct": 33.76, "yPct": 47.84}, {"stage": 14, "xPct": 26.9, "yPct": 42.03}, {"stage": 15, "xPct": 41.19, "yPct": 39.77}, {"stage": 16, "xPct": 53.57, "yPct": 37.18}, {"stage": 17, "xPct": 47.29, "yPct": 31.83}, {"stage": 18, "xPct": 59.19, "yPct": 28.2}, {"stage": 19, "xPct": 74.67, "yPct": 25.1}, {"stage": 20, "xPct": 74.67, "yPct": 20.4}, {"stage": 21, "xPct": 59.67, "yPct": 18.51}, {"stage": 22, "xPct": 46.57, "yPct": 16.63}, {"stage": 23, "xPct": 46.81, "yPct": 11.25}, {"stage": 24, "xPct": 57.05, "yPct": 5.87}, {"stage": 25, "xPct": 41.1, "yPct": 2.64}]}, {"chapter": 2, "imageNaturalSize": {"width": 941, "height": 1672}, "stages": [{"stage": 1, "xPct": 61.19, "yPct": 97.24}, {"stage": 2, "xPct": 54.33, "yPct": 92.07}, {"stage": 3, "xPct": 40.43, "yPct": 87.12}, {"stage": 4, "xPct": 46.9, "yPct": 82.39}, {"stage": 5, "xPct": 57.29, "yPct": 78.59}, {"stage": 6, "xPct": 68.24, "yPct": 74.42}, {"stage": 7, "xPct": 59.67, "yPct": 70.12}, {"stage": 8, "xPct": 48, "yPct": 67.43}, {"stage": 9, "xPct": 38.71, "yPct": 63.66}, {"stage": 10, "xPct": 38.48, "yPct": 57.88}, {"stage": 11, "xPct": 49.19, "yPct": 54.65}, {"stage": 12, "xPct": 59.67, "yPct": 51.69}, {"stage": 13, "xPct": 68.24, "yPct": 47.65}, {"stage": 14, "xPct": 59.43, "yPct": 44.15}, {"stage": 15, "xPct": 48.48, "yPct": 41.19}, {"stage": 16, "xPct": 39.19, "yPct": 38.23}, {"stage": 17, "xPct": 37.95, "yPct": 32.34}, {"stage": 18, "xPct": 49.76, "yPct": 29.33}, {"stage": 19, "xPct": 59.67, "yPct": 25.99}, {"stage": 20, "xPct": 57.76, "yPct": 20.21}, {"stage": 21, "xPct": 47.48, "yPct": 17.17}, {"stage": 22, "xPct": 40.14, "yPct": 12.19}, {"stage": 23, "xPct": 51.1, "yPct": 8.83}, {"stage": 24, "xPct": 58.71, "yPct": 5.06}, {"stage": 25, "xPct": 46.33, "yPct": 1.96}]}, {"chapter": 3, "imageNaturalSize": {"width": 940, "height": 1672}, "stages": [{"stage": 1, "xPct": 60.62, "yPct": 98.03}, {"stage": 2, "xPct": 53.95, "yPct": 92.79}, {"stage": 3, "xPct": 43.1, "yPct": 89.35}, {"stage": 4, "xPct": 37.95, "yPct": 82.79}, {"stage": 5, "xPct": 49.95, "yPct": 80.11}, {"stage": 6, "xPct": 57.76, "yPct": 76.13}, {"stage": 7, "xPct": 58.71, "yPct": 71.03}, {"stage": 8, "xPct": 48.62, "yPct": 67.64}, {"stage": 9, "xPct": 39.19, "yPct": 64.58}, {"stage": 10, "xPct": 39.9, "yPct": 59.07}, {"stage": 11, "xPct": 51.1, "yPct": 56.79}, {"stage": 12, "xPct": 61.1, "yPct": 53.83}, {"stage": 13, "xPct": 61.81, "yPct": 48.19}, {"stage": 14, "xPct": 50.38, "yPct": 45.24}, {"stage": 15, "xPct": 38.95, "yPct": 41.75}, {"stage": 16, "xPct": 45.38, "yPct": 37.02}, {"stage": 17, "xPct": 39.67, "yPct": 29.5}, {"stage": 18, "xPct": 55.29, "yPct": 33.15}, {"stage": 19, "xPct": 61, "yPct": 27.99}, {"stage": 20, "xPct": 50.33, "yPct": 24.23}, {"stage": 21, "xPct": 39.67, "yPct": 20.47}, {"stage": 22, "xPct": 48.43, "yPct": 15.31}, {"stage": 23, "xPct": 59.29, "yPct": 10.8}, {"stage": 24, "xPct": 57.57, "yPct": 5.64}, {"stage": 25, "xPct": 49.95, "yPct": 1.88}]}, {"chapter": 4, "imageNaturalSize": {"width": 941, "height": 1672}, "stages": [{"stage": 1, "xPct": 56.43, "yPct": 98.42}, {"stage": 2, "xPct": 48.24, "yPct": 94.2}, {"stage": 3, "xPct": 25, "yPct": 91.32}, {"stage": 4, "xPct": 37.38, "yPct": 88.63}, {"stage": 5, "xPct": 48.43, "yPct": 85.83}, {"stage": 6, "xPct": 55.67, "yPct": 80.88}, {"stage": 7, "xPct": 47.67, "yPct": 76.36}, {"stage": 8, "xPct": 37.19, "yPct": 73.13}, {"stage": 9, "xPct": 28.81, "yPct": 68.61}, {"stage": 10, "xPct": 39.48, "yPct": 64.95}, {"stage": 11, "xPct": 50.33, "yPct": 61.94}, {"stage": 12, "xPct": 60.24, "yPct": 58.17}, {"stage": 13, "xPct": 59.1, "yPct": 52.36}, {"stage": 14, "xPct": 48.81, "yPct": 49.88}, {"stage": 15, "xPct": 40.43, "yPct": 46.23}, {"stage": 16, "xPct": 33.95, "yPct": 34.39}, {"stage": 17, "xPct": 48.24, "yPct": 40.52}, {"stage": 18, "xPct": 58.33, "yPct": 36.65}, {"stage": 19, "xPct": 63.29, "yPct": 31.7}, {"stage": 20, "xPct": 52.62, "yPct": 28.36}, {"stage": 21, "xPct": 41.57, "yPct": 24.92}, {"stage": 22, "xPct": 31.1, "yPct": 22.33}, {"stage": 23, "xPct": 25.19, "yPct": 18.57}, {"stage": 24, "xPct": 37.29, "yPct": 17.41}, {"stage": 25, "xPct": 45.62, "yPct": 13.13}]}];

// ── 실제 게임 진행 데이터로 교체할 부분 ──────────────────
// 전체 스테이지를 1번부터 순서대로 이어서 세는 "글로벌 클리어 개수"
// 예: 37 이면 1~37번까지 클리어, 38번이 현재 도전 스테이지
const GLOBAL_CLEARED_COUNT = 37;
// ─────────────────────────────────────────────────────

const mapScroll = document.getElementById('mapScroll');
const chTitleEl = document.getElementById('chTitle');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let currentChapterIdx = 0;

// 챕터별 시작 글로벌 스테이지 번호 계산
let globalOffset = 0;
STAGE_DATA.forEach(ch => { ch._globalStart = globalOffset + 1; globalOffset += ch.stages.length; });

function buildPanel(chapterData){
  const panel = document.createElement('div');
  panel.className = 'chapterPanel';
  panel.dataset.chapter = chapterData.chapter;

  // mapCanvas: fixed aspect-ratio box, exactly matching the source image.
  // Every node's xPct/yPct is positioned relative to THIS element only.
  const mapCanvas = document.createElement('div');
  mapCanvas.className = 'mapCanvas';
  mapCanvas.style.aspectRatio = chapterData.imageNaturalSize.width + ' / ' + chapterData.imageNaturalSize.height;

  const img = document.createElement('img');
  img.className = 'bg';
  img.src = ASSET_PATHS.bg[String(chapterData.chapter)];
  mapCanvas.appendChild(img);

  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('class', 'connector');
  svg.setAttribute('viewBox', '0 0 100 ' + (100 * chapterData.imageNaturalSize.height / chapterData.imageNaturalSize.width));
  svg.setAttribute('preserveAspectRatio', 'none');

  const h = 100 * chapterData.imageNaturalSize.height / chapterData.imageNaturalSize.width;
  const stages = chapterData.stages;
  for(let i = 0; i < stages.length - 1; i++){
    const a = stages[i], b = stages[i+1];
    const line = document.createElementNS(svgNS, 'line');
    line.setAttribute('x1', a.xPct); line.setAttribute('y1', a.yPct * h / 100);
    line.setAttribute('x2', b.xPct); line.setAttribute('y2', b.yPct * h / 100);
    svg.appendChild(line);
  }
  mapCanvas.appendChild(svg);

  stages.forEach(s => {
    const globalNum = chapterData._globalStart + s.stage - 1;
    let state = 'locked';
    if(globalNum <= GLOBAL_CLEARED_COUNT) state = 'cleared';
    else if(globalNum === GLOBAL_CLEARED_COUNT + 1) state = 'current';

    const node = document.createElement('div');
    node.className = 'node ' + state;
    node.style.left = s.xPct + '%';
    node.style.top = s.yPct + '%';

    const stoneImg = document.createElement('img');
    stoneImg.className = 'stoneImg';
    const stoneKey = state === 'cleared' ? 'stoneCleared'
                    : state === 'current' ? 'stoneCurrent'
                    : 'stoneLocked';
    stoneImg.src = ASSET_PATHS[stoneKey];
    node.appendChild(stoneImg);

    const label = document.createElement('div');
    label.className = 'label';
    if(state === 'locked'){ label.textContent = '🔒'; }
    else if(state === 'cleared'){ label.innerHTML = '<span class="star">★</span>'; }
    else { label.textContent = s.stage; }
    node.appendChild(label);

    node.addEventListener('click', () => {
      if(state === 'locked'){
        console.log(`스테이지 ${globalNum}: 잠김`);
        return;
      }
      console.log(`스테이지 ${globalNum} (챕터 ${chapterData.chapter} - ${s.stage}번) 선택`);
      alert(`스테이지 ${globalNum} 시작!`);
    });

    mapCanvas.appendChild(node);
  });

  panel.appendChild(mapCanvas);

  const endCap = document.createElement('div');
  endCap.id = 'chapterEndCap';
  endCap.textContent = chapterData.stages.length + '개 스테이지';
  panel.appendChild(endCap);

  return panel;
}

STAGE_DATA.forEach((ch, idx) => {
  const panel = buildPanel(ch);
  if(idx === 0) panel.classList.add('active');
  mapScroll.appendChild(panel);
});

function showChapter(idx){
  currentChapterIdx = idx;
  document.querySelectorAll('.chapterPanel').forEach((p, i) => {
    p.classList.toggle('active', i === idx);
  });
  chTitleEl.textContent = STAGE_DATA[idx].chapter + '챕터';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx === STAGE_DATA.length - 1;
  window.scrollTo(0, 0);
}

prevBtn.addEventListener('click', () => { if(currentChapterIdx > 0) showChapter(currentChapterIdx - 1); });
nextBtn.addEventListener('click', () => { if(currentChapterIdx < STAGE_DATA.length - 1) showChapter(currentChapterIdx + 1); });

showChapter(0);

// 현재 진행 중인 챕터로 자동 이동
const currentGlobal = GLOBAL_CLEARED_COUNT + 1;
const targetChapterIdx = STAGE_DATA.findIndex(ch => currentGlobal >= ch._globalStart && currentGlobal < ch._globalStart + ch.stages.length);
if(targetChapterIdx >= 0) showChapter(targetChapterIdx);
</script>
</body>
</html>

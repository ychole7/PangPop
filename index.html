<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1008">
<title>낱글자 팡팡!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
  <!-- 1. 배경과 게임판 (화면 전체 꽉 채움) -->
  <div id="stage">
    <div id="scoreScroll"><b id="uiScoreBig">0</b></div>
    <canvas id="cv"></canvas>
  </div>

  <!-- 2. UI 레이어 (화면 위에 둥둥 떠 있는 메뉴들) -->
  <div id="uiLayer">
    <!-- 상단 메뉴바 (참고 게임처럼 세련된 분리형) -->
    <div class="top-bar">
      <div class="left-buttons">
        <button class="icon-btn" id="btnMenu">❚❚</button>
        <button class="icon-btn" id="btnMute">🔊</button>
        <button class="icon-btn" id="btnShop">🛒</button>
      </div>
      <div class="right-stats">
        <div class="stat-pill">❤️ <b id="uiLives">6</b></div>
        <div class="stat-pill">S<b id="uiStage">1</b></div>
        <div class="stat-pill">💰 <b id="uiCoins">0</b></div>
      </div>
    </div>

    <!-- 목표 단어 표시줄 -->
    <div id="targetBar"></div>

    <!-- 중간 여백 (게임 화면을 위해 비워둠) -->
    <div class="spacer" style="flex:1;"></div>

    <!-- 하단 아이템 (깔끔하게 정렬된 4버튼) -->
    <div class="bottom-bar">
      <button class="item-btn" id="btnHint">💡 <b id="uiHint">3</b></button>
      <button class="item-btn" id="btnSwap">🔄 <b id="uiSwap">3</b></button>
      <button class="item-btn" id="btnBomb">💣 <b id="uiBomb">2</b></button>
      <button class="item-btn" id="btnRainbow">🌈 <b id="uiRainbow">2</b></button>
    </div>
  </div>

  <!-- 지도 및 메뉴 모달 -->
  <div class="veil" id="veil"><div class="card" id="card"></div></div>
  <div id="mapVeil"><div id="mapScroll"></div><div id="mapLives"></div><div id="seasonTabs"></div></div>
</div>

<script src="game.js"></script>
</body>
</html>
